<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Seed City Arcade</title>
<meta name="description" content="Get your friends into one room, then play Neon Cycles and Neon Sumo together without swapping codes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=JetBrains+Mono:wght@500;700&family=Figtree:wght@400;600&display=swap">
<style>
/* Seed City Arcade: the same dark neon as the games; one party, pick a cabinet */
:root{
  color-scheme:dark;
  --bg:#02030a; --panel:rgba(6,10,20,.84); --line:rgba(120,220,255,.22); --fg:#eaf6ff; --muted:#8aa0b4;
  --cyan:#33d9ff; --amber:#ffb45e; --magenta:#ff4fbf;
  --f-display:"Michroma",system-ui,sans-serif; --f-data:"JetBrains Mono",ui-monospace,monospace; --f-body:"Figtree",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--f-body);-webkit-tap-highlight-color:transparent}
body{overflow-y:auto}
#bg{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
main{position:relative;z-index:1;min-height:100%;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 24px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px))}
.card{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;gap:16px}
.kicker{font:700 11px/1 var(--f-data);letter-spacing:.22em;color:var(--cyan);margin:0}
.title{font:400 34px/1.08 var(--f-display);letter-spacing:.04em;margin:0;text-shadow:0 0 18px rgba(51,217,255,.55);text-wrap:balance}
.sub{font:14px/1.5 var(--f-body);color:var(--muted);margin:0}
.big{font:700 52px/1 var(--f-data);letter-spacing:.18em;text-align:center;text-shadow:0 0 16px rgba(51,217,255,.6)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;padding:13px 16px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);display:grid;gap:3px}
.btn b{font:600 16px/1.2 var(--f-body)}
.btn span{font:12px/1.35 var(--f-body);color:var(--muted)}
.btn:hover{border-color:var(--cyan);background:rgba(51,217,255,.12)}
.btn:focus-visible,.cab:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.btn.small{padding:10px 14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.code{box-sizing:border-box;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--fg);font:700 22px/1 var(--f-data);letter-spacing:.35em;text-align:center;text-transform:uppercase}
.code:focus{outline:2px solid var(--cyan);outline-offset:2px}
.code::placeholder{color:var(--muted);letter-spacing:.2em;font-size:13px}
.label{font:700 10px/1 var(--f-data);letter-spacing:.22em;color:var(--muted);margin:4px 0 -6px}
.cabs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cab{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.3);display:grid;gap:8px;padding:0 0 14px;overflow:hidden;text-decoration:none;color:inherit;transition:transform .15s,border-color .15s}
.cab:hover{border-color:var(--c);transform:translateY(-2px)}
.cab svg{display:block;width:100%;height:auto;aspect-ratio:16/9;max-width:100%;background:#050a16}
.cab b{font:400 15px/1.2 var(--f-display);letter-spacing:.05em;padding:0 14px;color:var(--c);text-shadow:0 0 12px var(--c)}
.cab span{font:12px/1.4 var(--f-body);color:var(--muted);padding:0 14px}
.cab.off{opacity:.45;pointer-events:none}
.roster{display:grid;gap:8px}
.pl{display:flex;align-items:center;gap:10px;font:600 14px/1 var(--f-data);letter-spacing:.08em}
.chip{width:12px;height:12px;border-radius:50%;box-shadow:0 0 10px currentColor;background:currentColor}
.tag{font:500 10px/1 var(--f-data);color:var(--muted);letter-spacing:.14em}
.name{box-sizing:border-box;width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--fg);font:600 15px/1.2 var(--f-body)}
.name:focus,.say input:focus{outline:2px solid var(--cyan);outline-offset:2px}
.chat{display:grid;gap:8px}
.log{max-height:210px;min-height:84px;overflow-y:auto;display:grid;align-content:start;gap:6px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.35);font:14px/1.4 var(--f-body);overflow-wrap:anywhere}
.log .msg b{font:700 13px/1 var(--f-data);letter-spacing:.06em;margin-right:6px}
.log .sys{color:var(--muted);font:600 11px/1.4 var(--f-data);letter-spacing:.12em}
.log .empty{color:var(--muted);font-size:13px}
.say{display:grid;grid-template-columns:1fr auto;gap:8px}
.say input{min-width:0;box-sizing:border-box;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--fg);font:15px/1.2 var(--f-body)}
.say input::placeholder,.name::placeholder{color:var(--muted)}
.status{font:600 12px/1.4 var(--f-data);letter-spacing:.12em;color:var(--amber);text-align:center}
@media (max-width:460px){ .cabs{grid-template-columns:1fr} .title{font-size:28px} .big{font-size:44px} }
@media (prefers-reduced-motion: reduce){ .cab{transition:none} .title,.big{text-shadow:none} }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<script src="../net-config.js"></script>
<main><div class="card" id="card" role="region" aria-label="Seed City Arcade"></div></main>
<script>
(() => {
'use strict';
/* =====================================================================
   SEED CITY ARCADE
   A party lobby that moves between games. Everyone joins one room code
   here; the host picks a game and the whole room goes there together:
   the host re-opens the same code in that game (#host=CODE&arcade), the
   others join it (#room=CODE&arcade&wait, retrying while it opens). Each
   game's lobby has "Back to arcade", which brings everyone back here.
   Networking is the same PeerJS star as the games, ids "seedarcade-<CODE>".
   ===================================================================== */
const $ = s => document.querySelector(s);
const GAMES = {
  cycles: {name: 'Neon Cycles', blurb: 'Leave a wall of light. Outlast everyone.', color: '#33d9ff'},
  sumo: {name: 'Neon Sumo', blurb: 'Knock everyone off a shrinking platform.', color: '#ff4fbf'},
};
const COLORS = ['#33d9ff', '#ffb45e', '#ff4fbf', '#8dff4a', '#a98bff', '#ff4b3e'];
const PREFIX = 'seedarcade-', PEERJS = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js', MAX = 6, TIMEOUT = window.NEONSUMO_TIMEOUT || 8;
let myName = '', log = [], quietUntil = 0, lastSay = -1e9;
try{ myName = cleanName(localStorage.getItem('seedarcade-name') || ''); }catch(_){}
let page = 'home', net = null, roster = [], myId = 'p0', err = '', status = '', lastCode = '', copied = false, going = null;

/* ---------- small pictures of each cabinet ---------- */
const art = {
  cycles: '<svg viewBox="0 0 160 90" aria-hidden="true"><defs><filter id="gc"><feGaussianBlur stdDeviation="1.6"/></filter></defs>' +
    '<g stroke="#1a3a66" stroke-width=".6">' + Array.from({length: 9}, (_, i) => '<line x1="' + (i*20) + '" y1="0" x2="' + (i*20) + '" y2="90"/>').join('') + Array.from({length: 5}, (_, i) => '<line x1="0" y1="' + (i*22 + 2) + '" x2="160" y2="' + (i*22 + 2) + '"/>').join('') + '</g>' +
    '<g fill="none" stroke-width="2.4" stroke-linejoin="round"><polyline points="10,70 60,70 60,30 110,30 110,52" stroke="#33d9ff" filter="url(#gc)"/><polyline points="10,70 60,70 60,30 110,30 110,52" stroke="#bff3ff" stroke-width="1"/>' +
    '<polyline points="150,18 90,18 90,60 130,60" stroke="#ffb45e" filter="url(#gc)"/><polyline points="150,18 90,18 90,60 130,60" stroke="#ffe3c2" stroke-width="1"/></g>' +
    '<circle cx="110" cy="54" r="3" fill="#fff"/><circle cx="132" cy="60" r="3" fill="#fff"/></svg>',
  sumo: '<svg viewBox="0 0 160 90" aria-hidden="true"><defs><filter id="gs"><feGaussianBlur stdDeviation="2"/></filter><radialGradient id="fl"><stop offset="0" stop-color="#0b1830"/><stop offset="1" stop-color="#050a16"/></radialGradient></defs>' +
    '<ellipse cx="80" cy="52" rx="62" ry="26" fill="url(#fl)" stroke="#33d9ff" stroke-width="1.6"/><ellipse cx="80" cy="52" rx="62" ry="26" fill="none" stroke="#33d9ff" stroke-width="3" filter="url(#gs)" opacity=".7"/>' +
    '<ellipse cx="80" cy="52" rx="40" ry="17" fill="none" stroke="#1a3a66"/><ellipse cx="80" cy="52" rx="20" ry="8.5" fill="none" stroke="#1a3a66"/>' +
    '<circle cx="64" cy="46" r="9" fill="#0a0f1c" stroke="#ff4fbf" stroke-width="2"/><circle cx="64" cy="46" r="12" fill="#ff4fbf" opacity=".25" filter="url(#gs)"/>' +
    '<circle cx="96" cy="54" r="9" fill="#0a0f1c" stroke="#8dff4a" stroke-width="2"/><circle cx="96" cy="54" r="12" fill="#8dff4a" opacity=".25" filter="url(#gs)"/>' +
    '<path d="M75 49 l6 2 M76 53 l5 -1" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/><circle cx="140" cy="20" r="6" fill="#0a0f1c" stroke="#ffb45e" stroke-width="1.6" opacity=".8"/></svg>',
};

/* ---------- pages ---------- */
function show(p){
  page = p;
  const c = $('#card');
  const cab = (g, attrs) => '<' + (attrs.href ? 'a href="' + attrs.href + '"' : 'button data-go="' + g + '"') + ' class="cab' + (attrs.off ? ' off' : '') + '" style="--c:' + GAMES[g].color + '">' + art[g] + '<b>' + GAMES[g].name + '</b><span>' + (attrs.note || GAMES[g].blurb) + '</span></' + (attrs.href ? 'a' : 'button') + '>';
  if (p === 'home'){
    c.innerHTML = '<p class="kicker">SEED CITY ARCADE</p><h1 class="title">One room. Every game.</h1>' +
      '<p class="sub">Get your friends into one party here. The host picks a game and everyone goes together, then comes back to pick the next one. Nobody has to swap codes.</p>' +
      '<p class="label">YOUR NAME</p><input class="name" id="name" maxlength="16" placeholder="What should friends call you?" autocomplete="nickname" spellcheck="false" aria-label="Your name" value="' + esc(myName) + '">' +
      '<button class="btn" data-id="host"><b>Start a party</b><span>Get a code to share (up to ' + MAX + ' players)</span></button>' +
      '<input class="code" id="code" maxlength="4" placeholder="PARTY CODE" autocomplete="off" spellcheck="false" aria-label="Party code" value="' + lastCode + '">' +
      '<button class="btn" data-id="join"><b>Join a party</b><span>Type the host’s four-letter code above</span></button>' +
      '<p class="label">PLAY SOLO</p><div class="cabs">' + cab('cycles', {href: '../cycles/'}) + cab('sumo', {href: '../sumo/'}) + '</div>';
    $('#name').addEventListener('input', e => { myName = cleanName(e.target.value); try{ localStorage.setItem('seedarcade-name', myName); }catch(_){} });
    const code = $('#code');
    code.addEventListener('input', () => { code.value = code.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); lastCode = code.value; });
    code.addEventListener('keydown', e => { if (e.key === 'Enter') join(code.value); });
  } else if (p === 'wait'){
    c.innerHTML = '<p class="kicker">SEED CITY ARCADE</p><p class="sub">' + status + '</p><button class="btn small" data-id="home"><b>Cancel</b></button>';
  } else if (p === 'err'){
    c.innerHTML = '<p class="kicker">SEED CITY ARCADE</p><p class="sub">' + err + '</p><button class="btn small" data-id="home"><b>Back</b></button>';
  } else if (p === 'party'){
    const host = net && net.role === 'host';
    const rosterHtml = '<div class="roster">' + roster.map(q => '<div class="pl"><span class="chip" style="color:' + COLORS[q.c % COLORS.length] + '"></span>' + esc(who(q).toUpperCase()) + (q.id === myId ? ' <span class="tag">YOU</span>' : '') + (q.id === 'p0' ? ' <span class="tag">HOST</span>' : '') + '</div>').join('') + '</div>';
    const mainHtml = going ? '<p class="status">HEADING TO ' + GAMES[going].name.toUpperCase() + '…</p>'
      : host ? '<p class="sub">Keep this page open on screen until everyone is in. Phones pause it in the background.</p><p class="label">PICK A GAME FOR EVERYONE</p><div class="cabs">' + cab('cycles', {}) + cab('sumo', {}) + '</div>'
             : '<p class="sub">You’re in. The host picks the game, and you’ll go there automatically.</p>';
    const copyHtml = host ? '<button class="btn small" data-id="copy"><b>' + (copied ? 'Link copied' : 'Copy invite link') + '</b><span>Opens the arcade straight into this party</span></button>' : '';
    // already showing this party: refresh the changing parts only, so the chat box (and anything half-typed) stays put
    if ($('#party') && $('#party').dataset.code === (net ? net.code : '')){
      $('#pcopy').innerHTML = copyHtml; $('#proster').innerHTML = rosterHtml; $('#pmain').innerHTML = mainHtml;
      return;
    }
    c.innerHTML = '<div id="party" data-code="' + (net ? net.code : '') + '" style="display:grid;gap:16px"><p class="kicker">PARTY</p><div class="big">' + (net ? net.code : '') + '</div>' +
      '<div id="pcopy">' + copyHtml + '</div><div id="proster">' + rosterHtml + '</div><div id="pmain" style="display:grid;gap:16px">' + mainHtml + '</div>' +
      '<p class="label">CHAT</p><div class="chat"><div id="log" class="log" role="log" aria-live="polite"></div>' +
      '<form id="sayf" class="say"><input id="say" maxlength="200" placeholder="Message the party" autocomplete="off" aria-label="Message the party"><button class="btn small" type="submit"><b>Send</b></button></form></div>' +
      '<button class="btn small" data-id="leave"><b>Leave party</b></button></div>';
    const say = $('#say');
    $('#sayf').addEventListener('submit', e => { e.preventDefault(); sendChat(say.value); say.value = ''; say.focus(); });
    renderLog();
  }
}
/* ---------- chat: the host keeps the log and passes each message to everyone ---------- */
function esc(t){ return String(t).replace(/[&<>"']/g, ch => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[ch])); }
function cleanName(t){ return String(t || '').replace(/[\u0000-\u001f\u007f]/g, '').replace(/\s+/g, ' ').trim().slice(0, 16); }
function cleanText(t){ return String(t || '').replace(/[\u0000-\u001f\u007f]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 200); }
const who = q => q.name || 'Player ' + (roster.indexOf(q) + 1);
function renderLog(){
  const el = $('#log'); if (!el) return;
  el.textContent = '';
  if (!log.length){ const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'No messages yet. Say hi.'; el.appendChild(e); return; }
  for (const m of log){
    const row = document.createElement('div');
    if (m.s){ row.className = 'sys'; row.textContent = m.x; }
    else { row.className = 'msg'; const b = document.createElement('b'); b.textContent = m.n; b.style.color = COLORS[m.c % COLORS.length]; row.appendChild(b); row.appendChild(document.createTextNode(m.x)); }
    el.appendChild(row);
  }
  el.scrollTop = el.scrollHeight;
}
function addLog(m){ log.push(m); if (log.length > 60) log.splice(0, log.length - 60); if (page === 'party') renderLog(); }
// host only: stamp a message with the sender's name and colour, keep it, pass it on
function hostPost(q, text, sys){
  const m = sys ? {s: 1, x: text} : {n: who(q), c: q.c, x: text};
  addLog(m); send({t: 'chat', m});
}
function sendChat(raw){
  const text = cleanText(raw), now = performance.now()/1000;
  if (!text || !net || now - lastSay < 0.7) return;   // a short cooldown so nobody floods the chat
  lastSay = now;
  if (net.role === 'host') hostPost(roster.find(q => q.id === myId), text);
  else send({t: 'say', x: text});
}
$('#card').addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g && net && net.role === 'host' && !going) return pick(g.dataset.go);
  const b = e.target.closest('.btn'); if (!b) return;
  const id = b.dataset.id;
  if (id === 'host') host(0);
  else if (id === 'join') join($('#code').value);
  else if (id === 'home' || id === 'leave'){ leave(); show('home'); }
  else if (id === 'copy'){
    const u = location.href.split('#')[0] + '#room=' + net.code;
    const done = () => { copied = true; show('party'); };
    try{ navigator.clipboard.writeText(u).then(done, () => prompt('Copy this invite link:', u)); }catch(_){ prompt('Copy this invite link:', u); }
  }
});

/* ---------- networking: PeerJS star, the same as the games ---------- */
function loadPeerJS(){
  return new Promise((res, rej) => {
    const ready = () => window.Peer || (window.peerjs && (window.peerjs.Peer || window.peerjs.default));
    if (ready()) return res(ready());
    const s = document.createElement('script'); s.src = PEERJS;
    s.onload = () => ready() ? res(ready()) : rej(new Error('the networking library did not start'));
    s.onerror = () => rej(new Error('could not download the networking library (check your connection)'));
    document.head.appendChild(s);
  });
}
const opts = () => window.NEONSUMO_PEER_OPTS || {debug: 0, config: {iceServers: iceServers(), sdpSemantics: 'unified-plan'}};
/* ---------- connection helpers, the same in every Seed City game ----------
   Relay servers come from ../net-config.js (shared by all the games), with a built-in fallback. */
const JOIN_TRIES = 3, JOIN_WAIT = window.SEEDCITY_JOIN_WAIT || 20;
function iceServers(){
  return window.SEEDCITY_ICE_SERVERS || [{urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302']},
    {urls: ['turn:eu-0.turn.peerjs.com:3478', 'turn:us-0.turn.peerjs.com:3478'], username: 'peerjs', credential: 'peerjsp'}];
}
// follow the direct connection as it is set up: 'checking' means the host answered
function watchIce(conn, me, onFail){
  let n = 0;
  const look = () => {
    if (net !== me || me.done || me.joined) return;
    const pc = conn.peerConnection;
    if (!pc){ if (++n < 100) setTimeout(look, 200); return; }
    pc.addEventListener('iceconnectionstatechange', () => {
      const s = pc.iceConnectionState;
      if (s === 'checking' && me.stage === 'host') me.stage = 'ice';
      if (s === 'failed') onFail();
    });
  };
  look();
}
function joinError(stage, code){
  if (stage === 'server') return 'Couldn’t reach the online service that finds rooms. Check your internet connection and try again.';
  if (stage === 'host' || stage === 'hello') return 'Found room ' + code + ', but the host’s game didn’t answer. The host needs to keep the game open on screen (phones pause it in the background, for example while sharing the link). Ask them to switch back to it, then try again.';
  return 'Found room ' + code + ', but your device and the host’s couldn’t connect. Some networks (mobile data, school or work Wi-Fi) block game connections: try Wi-Fi, or have someone else host.';
}
// keep a hosting phone's screen on, so the game isn't paused while friends join
let wakeLock = null;
async function keepAwake(on){
  try{
    if (on && !wakeLock && navigator.wakeLock && document.visibilityState === 'visible'){ wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
    else if (!on && wakeLock){ const w = wakeLock; wakeLock = null; await w.release(); }
  }catch(_){ wakeLock = null; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && net && net.role === 'host') keepAwake(true); });

const newCode = () => { const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let c = ''; for (let i = 0; i < 4; i++) c += A[Math.floor(Math.random()*A.length)]; return c; };
function fail(text){ leave(); err = text; show('err'); }
function leave(){ keepAwake(false); going = null; if (!net) return; const n = net; net = null; try{ n.peer.destroy(); }catch(_){} roster = []; }
function send(m){
  if (!net) return;
  if (net.role === 'host'){ for (const c of net.conns.keys()) if (c.open) c.send(m); }
  else if (net.conn && net.conn.open) net.conn.send(m);
}
function freeColor(){ for (let c = 0; c < COLORS.length; c++) if (!roster.some(q => q.c === c)) return c; return roster.length % COLORS.length; }
async function host(attempt, fixed){
  leave(); status = 'Opening a party…'; show('wait');
  let P; try{ P = await loadPeerJS(); }catch(e){ return fail('Couldn’t start online play: ' + e.message + '.'); }
  if (page !== 'wait') return;
  const code = fixed || newCode(), peer = new P(PREFIX + code, opts());
  net = {role: 'host', code, peer, conns: new Map(), nextId: 1};
  keepAwake(true);
  const me = net;
  peer.on('open', () => {
    if (net !== me) return;
    myId = 'p0'; roster = [{id: 'p0', c: 0, name: myName}]; copied = false; log = [];
    if (fixed){   // back from a game: bring the conversation back, and don't announce everyone rejoining
      try{ log = JSON.parse(sessionStorage.getItem('seedarcade-chat-' + code) || '[]'); }catch(_){ log = []; }
      quietUntil = performance.now()/1000 + 25;
    }
    show('party');
  });
  peer.on('connection', conn => {
    conn.on('data', d => recv(d, conn));
    conn.on('close', () => drop(conn));
    conn.on('error', () => drop(conn));
  });
  peer.on('disconnected', () => { try{ if (!peer.destroyed) peer.reconnect(); }catch(_){} });
  peer.on('error', e => {
    if (net !== me) return;
    if (e.type === 'unavailable-id' && fixed && (attempt || 0) < 8){ try{ peer.destroy(); }catch(_){} return setTimeout(() => { if (net === me) host((attempt || 0) + 1, fixed); }, 1000); }
    if (e.type === 'unavailable-id' && (attempt || 0) < 4) return host((attempt || 0) + 1);
    if (page !== 'party') fail('Couldn’t open a party (' + (e.type || 'error') + '). Try again in a moment.');
  });
}
async function join(code, attempt, wait, tries){
  // find the party through the PeerJS matchmaker, then connect straight to the host;
  // each step is tracked so a failure says what went wrong, and failures are retried
  code = String(code || '').trim().toUpperCase(); lastCode = code; tries = tries || 1;
  if (!/^[A-Z0-9]{4}$/.test(code)){ err = 'Party codes are four letters or digits.'; show('err'); return; }
  leave(); status = 'Joining party ' + code + '…' + (tries > 1 ? '<br>Trying again (' + tries + ' of ' + JOIN_TRIES + ')' : ''); show('wait');
  let P; try{ P = await loadPeerJS(); }catch(e){ return fail('Couldn’t start online play: ' + e.message + '.'); }
  if (page !== 'wait') return;
  const peer = new P(opts());
  net = {role: 'client', code, peer, conn: null, hostLast: performance.now()/1000, joined: false, stage: 'server', done: false};
  const me = net;
  const retry = () => {
    if (net !== me || me.joined || me.done || going) return;
    me.done = true;
    if (tries < JOIN_TRIES) setTimeout(() => { if (net === me) join(code, attempt, wait, tries + 1); }, 700);
    else fail(joinError(me.stage, code).replace(/room/g, 'party'));
  };
  peer.on('open', () => {
    if (net !== me) return;
    me.stage = 'host';
    const conn = peer.connect(PREFIX + code, {reliable: true, serialization: 'json'});
    me.conn = conn;
    watchIce(conn, me, retry);
    conn.on('open', () => { me.stage = 'hello'; conn.send({t: 'hello', name: myName}); });
    conn.on('data', d => recv(d, conn));
    conn.on('close', () => { if (net !== me || going) return; if (me.joined) fail('The host closed the party.'); else retry(); });
    conn.on('error', () => { if (net !== me || going) return; if (me.joined) fail('The connection to the host failed.'); else retry(); });
  });
  peer.on('error', e => {
    if (net !== me) return;
    if (e.type === 'peer-unavailable' && wait && (attempt || 0) < 12){ me.done = true; setTimeout(() => { if (net === me) join(code, (attempt || 0) + 1, wait, tries); }, 1500); return; }
    if (e.type === 'peer-unavailable'){ me.done = true; fail('No party called ' + code + '. Check the code with the host.'); return; }
    if (me.joined) fail('Connection problem (' + (e.type || 'error') + ').'); else retry();
  });
  setTimeout(retry, JOIN_WAIT*1000);
}
function drop(conn){
  if (!net || net.role !== 'host') return;
  const info = net.conns.get(conn); if (!info) return;
  net.conns.delete(conn); try{ conn.close(); }catch(_){}
  const gone = roster.find(q => q.id === info.id);
  roster = roster.filter(q => q.id !== info.id);
  send({t: 'roster', roster}); if (page === 'party') show('party');
  if (gone && !going && performance.now()/1000 > quietUntil) hostPost(null, who(gone) + ' left', true);
}
function recv(d, conn){
  if (!net || !d || typeof d !== 'object') return;
  const now = performance.now()/1000;
  if (net.role === 'host'){
    if (d.t === 'hello'){
      if (roster.length >= MAX){ conn.send({t: 'full'}); setTimeout(() => { try{ conn.close(); }catch(_){} }, 300); return; }
      const id = 'p' + (net.nextId++);
      net.conns.set(conn, {id, last: now});
      const q = {id, c: freeColor(), name: cleanName(d.name)};
      roster.push(q);
      conn.send({t: 'welcome', id, roster, going, log: log.slice(-40)});
      send({t: 'roster', roster}); show('party');
      if (now > quietUntil) hostPost(null, who(q) + ' joined', true);
      return;
    }
    const info = net.conns.get(conn); if (!info) return;
    info.last = now;
    if (d.t === 'say'){
      const text = cleanText(d.x), q = roster.find(r => r.id === info.id);
      if (!text || !q || now - (info.lastSay ?? -1e9) < 0.7) return;
      info.lastSay = now; hostPost(q, text);
    }
  } else {
    net.hostLast = now;
    if (d.t === 'welcome'){ net.joined = true; myId = d.id; roster = d.roster; log = Array.isArray(d.log) ? d.log : []; show('party'); if (d.going) go(d.going); return; }
    if (d.t === 'chat'){ if (d.m && typeof d.m.x === 'string') addLog({n: cleanName(d.m.n), c: d.m.c | 0, x: cleanText(d.m.x), s: d.m.s ? 1 : 0}); return; }
    if (d.t === 'roster'){ roster = d.roster; if (page === 'party') show('party'); return; }
    if (d.t === 'full') return fail('That party is full (' + MAX + ' players).');
    if (d.t === 'go') return go(d.g);
  }
}
// host picks a game: tell everyone, then re-open the same code inside that game
function pick(g){ going = g; try{ sessionStorage.setItem('seedarcade-chat-' + net.code, JSON.stringify(log.slice(-40))); }catch(_){} send({t: 'go', g}); show('party'); setTimeout(() => { location.href = '../' + g + '/#host=' + net.code + '&arcade'; }, 400); }
function go(g){ if (!GAMES[g]) return; going = g; show('party'); location.href = '../' + g + '/#room=' + net.code + '&arcade&wait'; }
setInterval(() => {
  if (!net) return;
  const now = performance.now()/1000;
  send({t: 'ping'});
  if (net.role === 'host'){ for (const [c, info] of [...net.conns]) if (now - info.last > TIMEOUT) drop(c); }
  else if (net.joined && !going && now - net.hostLast > TIMEOUT) fail('Lost the connection to the host.');
}, 1000);
addEventListener('pagehide', () => { if (net && !going) leave(); });

/* ---------- background: a slow neon grid running toward the horizon ----------
   Grid coordinates: u is the line across (-24..24, the lines fanning out from the horizon),
   q is the line along (horizontal lines sit at whole q and scroll toward you with the grid).
   Pulses run along these lines like current in a circuit: down a fanning line toward you,
   sometimes turning onto a crossing line and back, and fade out at the edges. */
const cv = $('#bg'), g2 = cv.getContext('2d');
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ROWS = 18, SCROLL = 0.35, NEAR = 0.012, FAR = 0.16;
const PULSE_COLORS = ['51,217,255', '51,217,255', '51,217,255', '255,79,191', '255,180,94'];
const pulses = [];
let lastT = 0, spawnT = 0;
function gridToScreen(u, q, S, w, h, hz){
  const z = (q + S)/ROWS, f = Math.pow(Math.max(0, z), 2.2);
  return [w/2 + u*w*(NEAR + (FAR - NEAR)*f), hz + (h - hz)*f, z];
}
function spawnPulse(S){
  // start somewhere in the far half on a fanning line, mostly out to the sides where the menu doesn't cover it
  const q = Math.floor(ROWS*(0.06 + Math.random()*0.45) - S) + 0.01;
  pulses.push({u: (Math.random() < 0.5 ? -1 : 1)*Math.round(3 + Math.random()*19), q, dir: 0, speed: 1.1 + Math.random()*0.8, col: PULSE_COLORS[Math.floor(Math.random()*PULSE_COLORS.length)], trail: [], life: 0});
}
function stepPulses(dt, S){
  spawnT -= dt;
  if (spawnT <= 0 && pulses.length < 9){ spawnPulse(S); spawnT = 0.7 + Math.random()*1.1; }
  for (let i = pulses.length - 1; i >= 0; i--){
    const p = pulses[i];
    p.life += dt;
    p.trail.push([p.u, p.q]); if (p.trail.length > 150) p.trail.shift();   // about 2.5 seconds of path
    if (p.dir === 0){   // along a fanning line, toward you
      const before = Math.floor(p.q);
      p.q += p.speed*dt;
      if (Math.floor(p.q) !== before && Math.random() < 0.3){ p.q = Math.floor(p.q); p.dir = Math.random() < 0.5 ? -1 : 1; }
    } else {            // along a crossing line, sideways
      const before = Math.round(p.u);
      p.u += p.dir*p.speed*1.4*dt;
      const now = p.dir > 0 ? Math.floor(p.u) : Math.ceil(p.u);
      if (now !== before && Math.abs(p.u - now) < 0.5 && Math.random() < 0.45){ p.u = now; p.dir = 0; p.q += 0.01; }
    }
    const z = (p.q + S)/ROWS;
    if ((p.q + S - p.trail.length/150*6)/ROWS > 1.1 || Math.abs(p.u) > 24.5) pulses.splice(i, 1);   // let the long tail run off-screen too
  }
}
function drawPulses(S, w, h, hz, dpr){
  g2.save(); g2.globalCompositeOperation = 'lighter'; g2.lineCap = 'round';
  for (const p of pulses){
    const pts = p.trail.concat([[p.u, p.q]]).map(([u, q]) => gridToScreen(u, q, S, w, h, hz));
    const head = pts[pts.length - 1], fade = Math.min(1, head[2]*2.4 + 0.15, p.life*3);
    for (let k = 1; k < pts.length; k++){
      const a = Math.pow(k/pts.length, 1.6)*0.85*fade;
      g2.strokeStyle = 'rgba(' + p.col + ',' + a.toFixed(3) + ')';
      g2.lineWidth = (1.4 + 3*Math.pow(Math.max(0, pts[k][2]), 2))*dpr;
      g2.beginPath(); g2.moveTo(pts[k - 1][0], pts[k - 1][1]); g2.lineTo(pts[k][0], pts[k][1]); g2.stroke();
    }
    const r = (3.5 + 11*Math.pow(Math.max(0, head[2]), 2))*dpr, glow = g2.createRadialGradient(head[0], head[1], 0, head[0], head[1], r*2.4);
    glow.addColorStop(0, 'rgba(255,255,255,' + (0.95*fade).toFixed(3) + ')');
    glow.addColorStop(0.25, 'rgba(' + p.col + ',' + (0.8*fade).toFixed(3) + ')');
    glow.addColorStop(1, 'rgba(' + p.col + ',0)');
    g2.fillStyle = glow; g2.beginPath(); g2.arc(head[0], head[1], r*2.4, 0, Math.PI*2); g2.fill();
  }
  g2.restore();
}
function drawBg(t){
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const w = cv.width = innerWidth*dpr, h = cv.height = innerHeight*dpr;
  const dt = Math.min(0.05, lastT ? (t - lastT)/1000 : 0); lastT = t;
  g2.fillStyle = '#02030a'; g2.fillRect(0, 0, w, h);
  const hz = h*0.42, glow = g2.createLinearGradient(0, hz - h*0.25, 0, hz + 4);
  glow.addColorStop(0, 'rgba(255,79,191,0)'); glow.addColorStop(1, 'rgba(255,79,191,.18)');
  g2.fillStyle = glow; g2.fillRect(0, hz - h*0.25, w, h*0.25 + 4);
  g2.strokeStyle = 'rgba(51,217,255,.35)'; g2.lineWidth = Math.max(1, w/1400);
  const cx = w/2;
  for (let i = -24; i <= 24; i++){ g2.beginPath(); g2.moveTo(cx + i*w*NEAR, hz); g2.lineTo(cx + i*w*FAR, h); g2.stroke(); }
  const S = still ? 0 : t/1000*SCROLL, off = S % 1;
  for (let k = 0; k < ROWS; k++){
    const z = (k + off)/ROWS, y = hz + (h - hz)*Math.pow(z, 2.2);
    g2.globalAlpha = Math.min(1, z*1.6); g2.beginPath(); g2.moveTo(0, y); g2.lineTo(w, y); g2.stroke();
  }
  g2.globalAlpha = 1;
  if (!still){ stepPulses(dt, S); drawPulses(S, w, h, hz, dpr); }
  if (!still) requestAnimationFrame(drawBg);
}
requestAnimationFrame(drawBg);

/* ---------- arriving: from an invite link, or back from a game ---------- */
show('home');
const hh = /host=([A-Za-z0-9]{4})/.exec(location.hash), hr = /room=([A-Za-z0-9]{4})/.exec(location.hash), wait = /(^|[#&])wait(&|$)/.test(location.hash);
if (hh || hr) try{ history.replaceState(null, '', location.pathname); }catch(_){}
if (hh) host(0, hh[1].toUpperCase());
else if (hr) join(hr[1], 0, wait);
window.__arcade = {log: () => log, say: t => sendChat(t), page: () => page, code: () => net && net.code, role: () => net && net.role, roster: () => roster};
})();
</script>
