<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Neon Sumo</title>
<meta name="description" content="Bumper sumo on a shrinking neon platform. Knock everyone off, last ball rolling wins. Solo against bots or online with friends.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=JetBrains+Mono:wght@500;700&family=Figtree:wght@400;600&display=swap">
<style>
/* Neon Sumo: same look as Neon Cycles */
:root{
  --bg:#02030a; --panel:rgba(6,10,20,.82); --line:rgba(120,220,255,.22); --fg:#eaf6ff; --muted:#8aa0b4;
  --cyan:#33d9ff; --amber:#ffb45e; --magenta:#ff4fbf;
  --f-display:"Michroma",system-ui,sans-serif; --f-data:"JetBrains Mono",ui-monospace,monospace; --f-body:"Figtree",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#menu{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at center,rgba(2,3,10,.35),rgba(2,3,10,.8))}
.card{width:min(460px,100%);max-height:calc(100% - 8px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;gap:14px}
.kicker{font:700 11px/1 var(--f-data);letter-spacing:.22em;color:var(--cyan);margin:0}
.title{font:400 34px/1.05 var(--f-display);letter-spacing:.04em;margin:0;text-shadow:0 0 18px rgba(51,217,255,.55)}
.sub{font:14px/1.45 var(--f-body);color:var(--muted);margin:0}
.big{font:700 52px/1 var(--f-data);letter-spacing:.18em;text-align:center;color:var(--fg);text-shadow:0 0 16px rgba(51,217,255,.6)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;padding:13px 16px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);display:grid;gap:3px}
.btn b{font:600 16px/1.2 var(--f-body)}
.btn span{font:12px/1.35 var(--f-body);color:var(--muted)}
.btn:hover,.btn.gp{border-color:var(--cyan);background:rgba(51,217,255,.12)}
.btn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.btn.small{padding:10px 14px}
.btn.off{opacity:.4;pointer-events:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.code{box-sizing:border-box;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--fg);font:700 22px/1 var(--f-data);letter-spacing:.35em;text-align:center;text-transform:uppercase;user-select:text}
.code:focus{outline:2px solid var(--cyan);outline-offset:2px}
.code::placeholder{color:var(--muted);letter-spacing:.2em;font-size:13px}
.roster{display:grid;gap:6px}
.pl{display:flex;align-items:center;gap:10px;font:600 14px/1 var(--f-data);letter-spacing:.08em}
.chip{width:12px;height:12px;border-radius:50%;box-shadow:0 0 10px currentColor;background:currentColor}
.tag{font:500 10px/1 var(--f-data);color:var(--muted);letter-spacing:.14em}
a.back{color:var(--muted);font:13px/1 var(--f-body);text-align:center;text-decoration:none}
a.back:hover{color:var(--fg)}
#hud{position:fixed;inset:0;pointer-events:none}
#round{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);font:700 12px/1 var(--f-data);letter-spacing:.2em;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;white-space:nowrap}
#board{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:16px;display:grid;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
#board .pl{font-size:13px}
#board .pl.dead{opacity:.35}
#board .wins{margin-left:auto;padding-left:14px;font-variant-numeric:tabular-nums}
#msg{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%);text-align:center;font:400 44px/1.1 var(--f-display);letter-spacing:.06em;text-shadow:0 0 24px rgba(51,217,255,.7);white-space:nowrap}
#msg small{display:block;font:600 14px/1.5 var(--f-data);letter-spacing:.2em;color:var(--muted);text-shadow:none;margin-top:8px}
#hint{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);left:50%;transform:translateX(-50%);font:12px/1.4 var(--f-body);color:var(--muted);white-space:nowrap;pointer-events:none}
#hint kbd{font:600 11px/1 var(--f-data);border:1px solid var(--line);border-radius:4px;padding:2px 5px;color:var(--fg)}
#dashbar{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);transform:translateX(-50%);width:160px;height:6px;border-radius:3px;background:rgba(255,255,255,.08);border:1px solid var(--line);overflow:hidden}
#dashbar i{display:block;height:100%;width:100%;background:var(--amber);transform-origin:left;box-shadow:0 0 10px var(--amber)}
#dashbar.ready{border-color:var(--amber)}
#touch{position:fixed;inset:0;pointer-events:none}
#stick{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:1px solid var(--line);background:rgba(6,10,20,.45);pointer-events:none}
#stick i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(51,217,255,.25);border:1px solid var(--cyan);box-shadow:0 0 16px rgba(51,217,255,.4)}
#stickhint{position:fixed;left:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);font:600 11px/1.4 var(--f-data);letter-spacing:.16em;color:var(--muted)}
#tdash{all:unset;pointer-events:auto;position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:108px;height:108px;border-radius:50%;border:1px solid var(--line);background:rgba(6,10,20,.5);display:grid;place-items:center;font:700 15px/1 var(--f-data);letter-spacing:.16em;color:var(--muted)}
#tdash.ready{border-color:var(--amber);color:#fff;box-shadow:0 0 18px rgba(255,180,94,.45);background:rgba(255,180,94,.18)}
@media (max-width:640px){ #round{left:auto;right:10px;transform:none;font-size:10px;padding:6px 10px} #msg{font-size:30px} }
@media (max-height:460px){ #hint{display:none} #dashbar{bottom:calc(env(safe-area-inset-bottom,0px) + 12px)} #board{gap:3px;padding:6px 10px} #board .pl{font-size:11px} }
@media (prefers-reduced-motion: reduce){ .title,#msg{text-shadow:none} }
</style>
</head>
<body>
<canvas id="c" aria-label="Neon Sumo arena"></canvas>
<div id="hud" hidden>
  <div id="round"></div>
  <div id="board"></div>
  <div id="msg"></div>
  <div id="dashbar"><i></i></div>
</div>
<div id="hint"></div>
<div id="touch" hidden><div id="stick" hidden><i></i></div><div id="stickhint">DRAG TO ROLL</div><button id="tdash" aria-label="Dash">DASH</button></div>
<div id="menu"><div class="card" id="card" role="dialog" aria-label="Neon Sumo menu"></div></div>
<p id="nogl" hidden style="position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center">WebGL is not available in this browser, so the arena can't be drawn.</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
/* =====================================================================
   NEON SUMO
   Roll your ball, dash into the others, knock them off the platform. The
   platform starts shrinking a few seconds into each round. Last ball on it
   takes the round; first to 3 rounds wins the match.

   Unlike Neon Cycles, balls push each other, so ONE machine runs all the
   physics: the solo player, or the host online (the "authority"). Joiners
   send only their stick and dash button; the host sends everyone's
   positions back 20 times a second. Joiners predict their own ball so
   controls feel instant, and nudge it toward what the host says.
   Match events (roster, round, out, win, match, lobby) go through
   apply(msg) on every machine, the same pattern as Neon Cycles.
   ===================================================================== */
const $ = s => document.querySelector(s);
let renderer;
try{ renderer = new THREE.WebGLRenderer({canvas: $('#c'), antialias: true, powerPreference: 'high-performance'}); }
catch(e){ $('#nogl').hidden = false; $('#menu').hidden = true; return; }
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));

/* ---------- tuning ---------- */
const BALL = 1, R0 = 14, RMIN = 5.5, SHRINK_AT = 6, SHRINK_RATE = 0.5, HOLD = 5;   // after HOLD seconds at RMIN, sudden death shrinks it to nothing
const ACC = 19, DRAG = 1.7, DASH = 15, DASH_CD = 1.5, BOUNCE = 1.3, GRAV = 32;
const WINS = 3, MAX_PLAYERS = 6, STEP = 1/60;
const COLORS = [['Cyan',0x33d9ff],['Amber',0xffb45e],['Magenta',0xff4fbf],['Lime',0x8dff4a],['Violet',0xa98bff],['Red',0xff4b3e]];

/* ---------- scene ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02030a);
scene.fog = new THREE.Fog(0x02030a, 40, 110);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 400);
scene.add(new THREE.HemisphereLight(0x8fb4ff, 0x0a0018, 0.75));
const sun = new THREE.DirectionalLight(0xffffff, 0.55); sun.position.set(-8, 20, 10); scene.add(sun);

function canvasTex(size, draw){ const c = document.createElement('canvas'); c.width = c.height = size; draw(c.getContext('2d'), size); const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t; }
const glowTex = canvasTex(128, (g, s) => { const r = g.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.25, 'rgba(255,255,255,.45)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, s, s); });

// the platform: a disc with a circuit-ring floor, a glowing rim and a dark side wall
const floorTex = canvasTex(1024, (g, s) => {
  const c = s/2;
  const bg = g.createRadialGradient(c, c, 0, c, c, c); bg.addColorStop(0, '#0b1830'); bg.addColorStop(1, '#050a16'); g.fillStyle = bg; g.fillRect(0, 0, s, s);
  g.strokeStyle = 'rgba(51,217,255,.28)'; g.lineWidth = 2;
  for (let i = 1; i <= 7; i++){ g.beginPath(); g.arc(c, c, c*i/7.2, 0, Math.PI*2); g.stroke(); }
  g.strokeStyle = 'rgba(51,217,255,.14)';
  for (let i = 0; i < 24; i++){ const a = i/24*Math.PI*2; g.beginPath(); g.moveTo(c + Math.cos(a)*c*0.14, c + Math.sin(a)*c*0.14); g.lineTo(c + Math.cos(a)*c, c + Math.sin(a)*c); g.stroke(); }
  g.fillStyle = 'rgba(51,217,255,.5)'; g.beginPath(); g.arc(c, c, 10, 0, Math.PI*2); g.fill();
});
const floor = new THREE.Mesh(new THREE.CircleGeometry(1, 96).rotateX(-Math.PI/2), new THREE.MeshStandardMaterial({map: floorTex, roughness: 0.55, metalness: 0.2, emissive: 0xffffff, emissiveMap: floorTex, emissiveIntensity: 0.55}));
scene.add(floor);
const side = new THREE.Mesh(new THREE.CylinderGeometry(1, 0.94, 1.4, 96, 1, true).translate(0, -0.7, 0), new THREE.MeshStandardMaterial({color: 0x060b18, roughness: 0.8, side: THREE.DoubleSide}));
scene.add(side);
const rimMat = new THREE.MeshBasicMaterial({color: 0x33d9ff});
const rim = new THREE.Mesh(new THREE.TorusGeometry(1, 0.014, 8, 128).rotateX(Math.PI/2), rimMat); scene.add(rim);
const curtainMat = new THREE.ShaderMaterial({transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  uniforms: {col: {value: new THREE.Color(0x33d9ff)}},
  vertexShader: 'varying float h; void main(){ h = uv.y; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: 'uniform vec3 col; varying float h; void main(){ gl_FragColor = vec4(col * pow(1.0 - h, 2.2) * 0.55, 1.0); }'});
const curtain = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 1, 96, 1, true).translate(0, 0.5, 0), curtainMat); scene.add(curtain);
// a faint ring where the edge started, so the shrink reads
const ghost = new THREE.Mesh(new THREE.TorusGeometry(R0, 0.06, 6, 128).rotateX(Math.PI/2), new THREE.MeshBasicMaterial({color: 0x33d9ff, transparent: true, opacity: 0.18})); ghost.position.y = 0.02; scene.add(ghost);
function setPlatform(R){ floor.scale.set(R, 1, R); side.scale.set(R, 1, R); rim.scale.set(R, R, R); rim.position.y = 0.03; curtain.scale.set(R, 0.9, R); }

// the void below: a far grid and drifting motes
const voidGrid = new THREE.GridHelper(400, 80, 0x1a3a66, 0x0d1d36); voidGrid.position.y = -38; scene.add(voidGrid);
{
  const n = 600, p = new Float32Array(n*3);
  for (let i = 0; i < n; i++){ const a = Math.random()*Math.PI*2, d = 22 + Math.random()*90; p[i*3] = Math.cos(a)*d; p[i*3+1] = -30 + Math.random()*55; p[i*3+2] = Math.sin(a)*d; }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({size: 0.6, map: glowTex, color: 0x3a7bd5, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending})));
}

// balls: dark shell with glowing bands (so you can see them roll), a halo and a floor glow
const ballTex = canvasTex(512, (g, s) => {
  g.fillStyle = '#0a0f1c'; g.fillRect(0, 0, s, s);
  g.fillStyle = '#ffffff';
  g.fillRect(0, s*0.47, s, s*0.06);
  for (let i = 0; i < 4; i++) g.fillRect(i*s/4, 0, s*0.025, s);
  g.fillRect(0, s*0.2, s, s*0.02); g.fillRect(0, s*0.78, s, s*0.02);
});
const ballGeo = new THREE.SphereGeometry(BALL, 40, 24);
const padGeo = new THREE.PlaneGeometry(3.6, 3.6).rotateX(-Math.PI/2);
const markGeo = new THREE.ConeGeometry(0.32, 0.6, 4).rotateX(Math.PI);
function makeBallMesh(color){
  const g = new THREE.Group();
  const ball = new THREE.Mesh(ballGeo, new THREE.MeshStandardMaterial({color, map: ballTex, emissive: color, emissiveMap: ballTex, emissiveIntensity: 1.1, roughness: 0.3, metalness: 0.25}));
  ball.position.y = BALL; g.add(ball);
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({map: glowTex, color, transparent: true, opacity: 0.45, depthWrite: false, blending: THREE.AdditiveBlending}));
  halo.scale.set(4.2, 4.2, 1); halo.position.y = BALL; g.add(halo);
  const pad = new THREE.Mesh(padGeo, new THREE.MeshBasicMaterial({color, map: glowTex, transparent: true, opacity: 0.6, depthWrite: false, blending: THREE.AdditiveBlending}));
  pad.position.y = 0.04; g.add(pad);
  scene.add(g);
  return {g, ball, halo, pad};
}
const youMark = new THREE.Mesh(markGeo, new THREE.MeshBasicMaterial({color: 0xffffff})); youMark.visible = false; scene.add(youMark);

// sparks
const SPARKS = 500, sp = new Float32Array(SPARKS*3), sc = new Float32Array(SPARKS*3), sv = new Float32Array(SPARKS*3), sl = new Float32Array(SPARKS);
let sNext = 0;
const sGeo = new THREE.BufferGeometry(); sGeo.setAttribute('position', new THREE.BufferAttribute(sp, 3)); sGeo.setAttribute('color', new THREE.BufferAttribute(sc, 3));
scene.add(new THREE.Points(sGeo, new THREE.PointsMaterial({size: 0.5, map: glowTex, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending})));
for (let i = 0; i < SPARKS; i++) sp[i*3+1] = -999;
function burst(x, y, z, color, n, speed){
  const c = new THREE.Color(color);
  for (let k = 0; k < n; k++){
    const i = sNext; sNext = (sNext + 1) % SPARKS;
    const a = Math.random()*Math.PI*2, u = Math.random()*0.9 + 0.1, v = speed*(0.4 + Math.random()*0.8);
    sp[i*3] = x; sp[i*3+1] = y; sp[i*3+2] = z;
    sv[i*3] = Math.cos(a)*v; sv[i*3+1] = u*v*0.8; sv[i*3+2] = Math.sin(a)*v;
    sc[i*3] = c.r; sc[i*3+1] = c.g; sc[i*3+2] = c.b; sl[i] = 0.5 + Math.random()*0.5;
  }
}
function sparksUpdate(dt){
  for (let i = 0; i < SPARKS; i++){
    if (sl[i] <= 0) continue;
    sl[i] -= dt;
    if (sl[i] <= 0){ sp[i*3+1] = -999; continue; }
    sv[i*3+1] -= 14*dt;
    sp[i*3] += sv[i*3]*dt; sp[i*3+1] += sv[i*3+1]*dt; sp[i*3+2] += sv[i*3+2]*dt;
    const f = Math.pow(0.1, dt); sc[i*3] *= f; sc[i*3+1] *= f; sc[i*3+2] *= f;
  }
  sGeo.attributes.position.needsUpdate = true; sGeo.attributes.color.needsUpdate = true;
}

/* ---------- sound: small synth, no files ---------- */
let actx = null, master = null, muted = false, userGestured = false;
function audio(){
  userGestured = true;
  if (!actx){ try{ actx = new (window.AudioContext || window.webkitAudioContext)(); master = actx.createGain(); master.gain.value = 0.5; master.connect(actx.destination); }catch(_){ return null; } }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(f0, f1, dur, type, vol, delay){
  if (!actx || muted) return;
  const t = actx.currentTime + (delay || 0), o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
}
let noiseBuf = null;
function noise(dur, freq, vol){
  if (!actx || muted) return;
  if (!noiseBuf){ noiseBuf = actx.createBuffer(1, actx.sampleRate*0.5, actx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1; }
  const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain(), t = actx.currentTime;
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.05);
}
const sfx = {
  bump(s){ const v = Math.min(1, s/18); noise(0.18, 600 + v*1800, 0.25 + v*0.5); tone(140 + v*60, 50, 0.16, 'sine', 0.3 + v*0.4); },
  dash(){ noise(0.22, 2600, 0.18); tone(260, 720, 0.16, 'sawtooth', 0.06); },
  fall(){ tone(520, 70, 0.9, 'triangle', 0.18); },
  out(){ noise(0.5, 400, 0.35); },
  beep(hi){ tone(hi ? 880 : 440, hi ? 880 : 440, hi ? 0.35 : 0.14, 'square', 0.07); },
  win(){ [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.3, 'triangle', 0.12, i*0.1)); },
};

/* ---------- game state ---------- */
let mode = 'menu';           // menu | solo | online
let state = 'idle';          // idle | lobby | countdown | run | over | match
let myId = 'p0', roster = [], scores = {}, round = 0, R = R0, tRun = 0, cdLeft = 0, overT = 0, matchT = 0, lastWinner = null;
let page = 'main', netErr = '', netStatus = '', lastCode = '', copied = false, nextBot = 1;
const riders = new Map();
const isAuth = () => mode === 'solo' || (net && net.role === 'host');
const nameOf = id => { const e = roster.find(q => q.id === id); const c = e ? COLORS[e.c % COLORS.length][0] : '?'; return id === myId ? 'You' : (e && e.bot ? c + ' bot' : c); };
const hex = c => '#' + c.toString(16).padStart(6, '0');
const colorOf = id => { const e = roster.find(q => q.id === id); return COLORS[(e ? e.c : 0) % COLORS.length][1]; };
function freeColor(){ for (let c = 0; c < COLORS.length; c++) if (!roster.some(q => q.c === c)) return c; return roster.length % COLORS.length; }

function syncRiders(){
  for (const id of [...riders.keys()]) if (!roster.some(q => q.id === id)) dropRider(id);
  for (const q of roster){
    let r = riders.get(q.id);
    if (r && r.c !== q.c){ dropRider(q.id); r = null; }
    if (!r){
      r = {id: q.id, c: q.c, bot: q.bot, x: 0, z: 0, vx: 0, vz: 0, y: 0, vy: 0, alive: false, falling: false, inRound: false,
           dashCd: 0, inp: {x: 0, z: 0}, dseq: 0, think: 0, pulse: 0, wasFalling: false,
           sx: 0, sz: 0, svx: 0, svz: 0, sy: 0, st: 0, dx: 0, dz: 0, dy: 0, mesh: makeBallMesh(COLORS[q.c % COLORS.length][1])};
      r.mesh.g.visible = false;
      riders.set(q.id, r);
    }
    r.bot = q.bot;
  }
}
function dropRider(id){
  const r = riders.get(id); if (!r) return;
  scene.remove(r.mesh.g); r.mesh.ball.material.dispose(); r.mesh.halo.material.dispose(); r.mesh.pad.material.dispose();
  riders.delete(id);
}

/* ---------- physics (authority runs it for everyone; joiners only for their own ball) ---------- */
function stepBall(r, dt, control){
  if (!r.falling && control){
    let ix = r.inp.x, iz = r.inp.z; const m = Math.hypot(ix, iz); if (m > 1){ ix /= m; iz /= m; }
    r.vx += ix*ACC*dt; r.vz += iz*ACC*dt;
  }
  const d = Math.exp(-(r.falling ? 0.3 : DRAG)*dt); r.vx *= d; r.vz *= d;
  r.x += r.vx*dt; r.z += r.vz*dt;
  if (r.falling){ r.vy -= GRAV*dt; r.y += r.vy*dt; }
  r.dashCd = Math.max(0, r.dashCd - dt);
}
function collide(a, b, onlyA){
  if (a.y < -1.2 || b.y < -1.2) return 0;
  const dx = b.x - a.x, dz = b.z - a.z, d = Math.hypot(dx, dz);
  if (d >= BALL*2 || d < 1e-6) return 0;
  const nx = dx/d, nz = dz/d, over = BALL*2 - d;
  const rv = (b.vx - a.vx)*nx + (b.vz - a.vz)*nz;
  if (onlyA){ a.x -= nx*over; a.z -= nz*over; } else { a.x -= nx*over/2; a.z -= nz*over/2; b.x += nx*over/2; b.z += nz*over/2; }
  if (rv >= 0) return 0;
  const j = -(1 + BOUNCE)*rv/2;
  a.vx -= j*nx; a.vz -= j*nz;
  if (!onlyA){ b.vx += j*nx; b.vz += j*nz; }
  return -rv;
}

  if (r.dashCd > 0 || r.falling || !r.alive) return false;
  let m = Math.hypot(dx, dz);
  if (m < 0.2){ dx = r.vx; dz = r.vz; m = Math.hypot(dx, dz); }
  if (m < 0.2){ dx = -r.x; dz = -r.z; m = Math.hypot(dx, dz) || 1; }
  r.vx += dx/m*DASH; r.vz += dz/m*DASH; r.dashCd = DASH_CD;
  return true;
}
let bumpGate = 0;
function authStep(dt){
  const live = [...riders.values()].filter(r => r.inRound && r.alive);
  for (const r of live){ if (r.bot) botThink(r, dt); stepBall(r, dt, state === 'run'); }
  for (let i = 0; i < live.length; i++) for (let j = i + 1; j < live.length; j++){
    const s = collide(live[i], live[j], false);
    if (s > 3 && bumpGate <= 0){ bumpGate = 0.06; emit({t: 'bump', x: +((live[i].x + live[j].x)/2).toFixed(2), z: +((live[i].z + live[j].z)/2).toFixed(2), s: +s.toFixed(1), a: live[i].id, b: live[j].id}); }
  }
  bumpGate -= dt;
  for (const r of live){
    if (!r.falling && Math.hypot(r.x, r.z) > R){ r.falling = true; r.vy = 0; }
    if (r.falling && r.y < -14) emit({t: 'out', id: r.id});

}

/* ---------- bots ---------- */
function botThink(r, dt){
  if (state !== 'run'){ r.inp.x = r.inp.z = 0; return; }
  r.think -= dt; if (r.think > 0) return;
  r.think = 0.16 + Math.random()*0.2;   // bots react a little late, so they can be caught out
  const d = Math.hypot(r.x, r.z) || 1e-3;
  let tgt = null, best = 1e9;
  for (const o of riders.values()){ if (o === r || !o.inRound || !o.alive || o.falling) continue; const k = Math.hypot(o.x - r.x, o.z - r.z); if (k < best){ best = k; tgt = o; } }
  let ix = 0, iz = 0;
  if (tgt){
    // aim at the side of the target facing the middle, so the hit pushes it outward
    const td = Math.hypot(tgt.x, tgt.z) || 1;
    let ax = tgt.x - r.x, az = tgt.z - r.z;
    if (best > 3){ ax = tgt.x - tgt.x/td*1.8 - r.x; az = tgt.z - tgt.z/td*1.8 - r.z; }
    const m = Math.hypot(ax, az) || 1; ix = ax/m; iz = az/m;
    if (r.dashCd <= 0 && best < 6 && best > 2.05 && (td > d - 2.5 || R < 8) && Math.random() < 0.45) doDashEmit(r, tgt.x - r.x, tgt.z - r.z);
  }
  const margin = R - d, safe = Math.min(3.2, R*0.35);
  if (margin < safe){
    const w = (safe - margin)/safe*1.5; ix -= r.x/d*w; iz -= r.z/d*w;
    const outward = (r.vx*r.x + r.vz*r.z)/d;
    if (margin < 1.6 && outward > 5 && r.dashCd <= 0 && Math.random() < 0.6) doDashEmit(r, -r.x, -r.z);
  }
  ix += (Math.random() - 0.5)*0.5; iz += (Math.random() - 0.5)*0.5;
  r.inp.x = ix; r.inp.z = iz;
}
function doDashEmit(r, dx, dz){ if (doDash(r, dx, dz)) emit({t: 'dash', id: r.id}); }

/* ---------- match flow (authority) ---------- */
function startMatch(){
  scores = {}; for (const q of roster) scores[q.id] = 0;
  round = 0; nextRound();
}
function platformR(t){
  const r = R0 - Math.max(0, t - SHRINK_AT)*SHRINK_RATE;
  if (r > RMIN) return r;
  const tMin = SHRINK_AT + (R0 - RMIN)/SHRINK_RATE;
  return Math.max(0, RMIN - Math.max(0, t - tMin - HOLD)*SHRINK_RATE*0.6);
}
function nextRound(){
  const n = roster.length, off = Math.random()*Math.PI*2;
  const s = roster.map((q, i) => { const a = off + i/n*Math.PI*2; return [q.id, +(Math.cos(a)*R0*0.58).toFixed(2), +(Math.sin(a)*R0*0.58).toFixed(2)]; });

}
function authTick(dt){
  if (state === 'run'){
    tRun += dt; R = platformR(tRun);
    const left = [...riders.values()].filter(r => r.inRound && r.alive);
    if (left.length <= 1 && roster.length > 1 || left.length === 0){
      const w = left.length === 1 ? left[0].id : null;
      if (w) scores[w] = (scores[w] || 0) + 1;
      emit({t: 'win', id: w, scores});
    }
  } else if (state === 'over'){
    overT -= dt;
    if (overT <= 0){
      const champ = Object.keys(scores).find(id => scores[id] >= WINS && roster.some(q => q.id === id));
      if (champ) emit({t: 'match', id: champ}); else nextRound();
    }
  } else if (state === 'match'){
    matchT -= dt;
    if (matchT <= 0){ if (mode === 'online') emit({t: 'lobby'}); else { state = 'idle'; showPage('again'); } }
  }
}

/* ---------- apply: every match event, on every machine ---------- */
function apply(m){
  const now = performance.now()/1000;
  switch (m.t){
    case 'roster':
      roster = m.roster; scores = m.scores || scores; syncRiders();
      if (page === 'lobby') showPage('lobby');
      drawBoard();
      break;
    case 'round':
      round = m.n; scores = m.scores || scores; R = R0; tRun = 0; cdLeft = 3; state = 'countdown';
      for (const r of riders.values()){ r.inRound = false; r.alive = false; r.mesh.g.visible = false; }
      for (const [id, x, z] of m.s){
        const r = riders.get(id); if (!r) continue;
        Object.assign(r, {x, z, vx: 0, vz: 0, y: 0, vy: 0, alive: true, falling: false, wasFalling: false, inRound: true, dashCd: 0, sx: x, sz: z, svx: 0, svz: 0, sy: 0, st: now, dx: x, dz: z, dy: 0});
        r.inp.x = r.inp.z = 0; r.mesh.g.visible = true;
      }
      $('#hud').hidden = false; showPage(null); lastBeep = 4;
      drawBoard();
      break;
    case 'bump': {
      const k = Math.min(1, m.s/16);
      burst(m.x, 1, m.z, 0xffffff, 6 + Math.round(k*18), 4 + k*8);
      sfx.bump(m.s);
      if (m.a === myId || m.b === myId){ shake = Math.max(shake, 0.12 + k*0.45); rumble(0.3 + k*0.6, 0.4, 120); }
      for (const id of [m.a, m.b]){ const r = riders.get(id); if (r) r.pulse = Math.max(r.pulse, 0.5 + k*0.5); }
      break;
    }
    case 'dash': {
      const r = riders.get(m.id); if (!r) break;
      if (m.id === myId && !isAuth()) break;   // joiners already showed their own dash
      dashFx(r);
      break;
    }
    case 'out': {
      const r = riders.get(m.id); if (!r || !r.alive) break;
      r.alive = false; r.mesh.g.visible = false;
      burst(r.dx, Math.max(-12, r.dy), r.dz, colorOf(r.id), 40, 9); sfx.out();
      if (m.id === myId){ flash('KNOCKED OUT', 'WATCH THE REST'); rumble(1, 1, 300); }
      drawBoard();
      break;
    }
    case 'win':
      scores = m.scores || scores; state = 'over'; overT = 3; lastWinner = m.id;
      if (m.id === myId){ flash('YOU WIN THE ROUND', score3()); sfx.win(); }
      else if (m.id) flash(nameOf(m.id).toUpperCase() + ' TAKES IT', score3());
      else flash('DRAW', 'NOBODY LEFT STANDING');
      drawBoard();
      break;
    case 'match':
      state = 'match'; matchT = 5;
      flash(m.id === myId ? 'YOU ARE THE CHAMPION' : nameOf(m.id).toUpperCase() + ' WINS', 'FIRST TO ' + WINS + ' ROUNDS');
      if (m.id === myId) sfx.win();
      break;
    case 'lobby':
      state = 'lobby';
      for (const r of riders.values()){ r.inRound = false; r.alive = false; r.mesh.g.visible = false; }
      $('#hud').hidden = true; $('#msg').innerHTML = ''; showPage('lobby');

}
function emit(m){ apply(m); netSend(m); }
const score3 = () => roster.map(q => (scores[q.id] || 0)).join(' · ');
function dashFx(r){
  r.pulse = 1;
  const m = Math.hypot(r.vx, r.vz) || 1;
  burst(r.dx - r.vx/m*0.9, 0.6, r.dz - r.vz/m*0.9, colorOf(r.id), 14, 5);

/* ---------- online: PeerJS star, the same design as Neon Cycles ----------
   The host registers "neonsumo-<CODE>" with the free PeerJS matchmaker; joiners connect to it.
   Joiners send {t:'in'} (stick + dash count). The host sends {t:'st'} snapshots plus match events. */
const NET_PREFIX = 'neonsumo-', PEERJS = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js', NET_TIMEOUT = window.NEONSUMO_TIMEOUT || 8;
let net = null;
function loadPeerJS(){
  return new Promise((res, rej) => {
    const ready = () => window.Peer || (window.peerjs && (window.peerjs.Peer || window.peerjs.default));
    if (ready()) return res(ready());
    const s = document.createElement('script'); s.src = PEERJS;
    s.onload = () => ready() ? res(ready()) : rej(new Error('the networking library did not start'));
    s.onerror = () => rej(new Error('could not download the networking library (check your connection)'));
    document.head.appendChild(s);
  });
}
const peerOpts = () => window.NEONSUMO_PEER_OPTS || {debug: 0};
function newCode(){ const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let c = ''; for (let i = 0; i < 4; i++) c += A[Math.floor(Math.random()*A.length)]; return c; }
function netFail(text){ netErr = text; netLeave(); mode = 'menu'; state = 'idle'; for (const id of [...riders.keys()]) dropRider(id); roster = []; $('#hud').hidden = true; $('#msg').innerHTML = ''; youMark.visible = false; showPage('err'); }
function netWait(text){ netStatus = text; showPage('wait'); }
function netLeave(){ if (!net) return; const n = net; net = null; try{ n.peer.destroy(); }catch(_){} }
function netSend(m){
  if (!net) return;
  if (net.role === 'host'){ for (const c of net.conns.keys()) if (c.open) c.send(m); }
  else if (net.conn && net.conn.open) net.conn.send(m);
}
async function netHost(attempt){
  netLeave(); netWait('Opening a room…');
  let P; try{ P = await loadPeerJS(); }catch(e){ return netFail('Couldn’t start online play: ' + e.message + '.'); }
  if (page !== 'wait') return;
  const code = newCode(), peer = new P(NET_PREFIX + code, peerOpts());
  net = {role: 'host', code, peer, conns: new Map(), nextId: 1};
  const me = net;
  peer.on('open', () => {
    if (net !== me) return;
    mode = 'online'; myId = 'p0'; state = 'lobby'; copied = false; nextBot = 1;
    roster = [{id: 'p0', c: 0, bot: false}]; scores = {}; round = 0; syncRiders();
    showPage('lobby');
  });
  peer.on('connection', conn => {
    conn.on('data', d => netRecv(d, conn));
    conn.on('close', () => netDrop(conn));
    conn.on('error', () => netDrop(conn));
  });
  peer.on('disconnected', () => { try{ if (!peer.destroyed) peer.reconnect(); }catch(_){} });
  peer.on('error', err => {
    if (net !== me) return;
    if (err.type === 'unavailable-id' && (attempt || 0) < 4) return netHost((attempt || 0) + 1);
    if (state !== 'lobby' && mode !== 'online') netFail('Couldn’t open a room (' + (err.type || 'error') + '). Try again in a moment.');
  });
}
async function netJoin(code){
  code = String(code || '').trim().toUpperCase(); lastCode = code;
  if (!/^[A-Z0-9]{4}$/.test(code)){ netErr = 'Room codes are four letters or digits.'; showPage('err'); return; }
  netLeave(); netWait('Joining room ' + code + '…');
  let P; try{ P = await loadPeerJS(); }catch(e){ return netFail('Couldn’t start online play: ' + e.message + '.'); }
  if (page !== 'wait') return;
  const peer = new P(peerOpts());
  net = {role: 'client', code, peer, conn: null, hostLast: performance.now()/1000, joined: false};
  const me = net;
  peer.on('open', () => {
    if (net !== me) return;
    const conn = peer.connect(NET_PREFIX + code, {reliable: true, serialization: 'json'});
    me.conn = conn;
    conn.on('open', () => conn.send({t: 'hello', v: 1}));
    conn.on('data', d => netRecv(d, conn));
    conn.on('close', () => { if (net === me) netFail(me.joined ? 'The host closed the room.' : 'The room closed before you got in.'); });
    conn.on('error', () => { if (net === me) netFail('The connection to the host failed.'); });
  });
  peer.on('error', err => {
    if (net !== me) return;
    if (err.type === 'peer-unavailable') netFail('No room called ' + code + '. Check the code with the host.');
    else netFail('Connection problem (' + (err.type || 'error') + ').');
  });
  setTimeout(() => { if (net === me && !me.joined) netFail('Couldn’t reach room ' + code + '. Some networks block direct connections; try another network or have someone else host.'); }, 15000);
}
function netDrop(conn){
  if (!net || net.role !== 'host') return;
  const info = net.conns.get(conn); if (!info) return;
  net.conns.delete(conn); try{ conn.close(); }catch(_){}
  const r = riders.get(info.id);
  if (r && r.alive && (state === 'run' || state === 'countdown')) emit({t: 'out', id: info.id});
  roster = roster.filter(q => q.id !== info.id); delete scores[info.id];
  emit({t: 'roster', roster, scores});
}
function netRecv(d, conn){
  if (!net || !d || typeof d !== 'object') return;
  const now = performance.now()/1000;
  if (net.role === 'host'){
    if (d.t === 'hello'){
      if (roster.length >= MAX_PLAYERS){ conn.send({t: 'full'}); setTimeout(() => { try{ conn.close(); }catch(_){} }, 300); return; }
      const id = 'p' + (net.nextId++);
      net.conns.set(conn, {id, last: now});
      roster.push({id, c: freeColor(), bot: false}); scores[id] = scores[id] || 0;
      conn.send({t: 'welcome', id, roster, scores, state, round});
      emit({t: 'roster', roster, scores});
      return;
    }
    const info = net.conns.get(conn); if (!info) return;
    info.last = now;
    if (d.t === 'in'){
      const r = riders.get(info.id); if (!r) return;
      r.inp.x = Math.max(-1, Math.min(1, +d.x || 0)); r.inp.z = Math.max(-1, Math.min(1, +d.z || 0));
      const seq = d.d | 0;
      if (seq > r.dseq){ r.dseq = seq; if (state === 'run' && r.inRound) doDashEmit(r, r.inp.x, r.inp.z); }
    }
  } else {
    net.hostLast = now;
    if (d.t === 'welcome'){
      net.joined = true; mode = 'online'; myId = d.id; roster = d.roster; scores = d.scores || {}; round = d.round || 0;
      syncRiders();
      if (d.state === 'lobby' || d.state === 'idle'){ state = 'lobby'; showPage('lobby'); }
      else { state = 'over'; $('#hud').hidden = false; showPage(null); flash('JOINED', 'YOU PLAY NEXT ROUND'); drawBoard(); }
      return;
    }
    if (d.t === 'full'){ netFail('That room is full (' + MAX_PLAYERS + ' players).'); return; }
    if (d.t === 'st'){ snapshot(d, now); return; }
    if (d.t === 'ping') return;
    apply(d);
  }
}
// host -> everyone: where every ball is
function sendSnapshot(){
  const b = [];
  for (const r of riders.values()) if (r.inRound && r.alive) b.push([r.id, +r.x.toFixed(2), +r.z.toFixed(2), +r.vx.toFixed(2), +r.vz.toFixed(2), +r.y.toFixed(2), r.falling ? 1 : 0]);
  netSend({t: 'st', n: round, R: +R.toFixed(3), b});
}
// joiner: take the host's word, gently for our own ball
function snapshot(d, now){
  if (d.n !== round) return;
  R = d.R;
  for (const [id, x, z, vx, vz, y, f] of d.b){
    const r = riders.get(id); if (!r || !r.alive) continue;
    r.sx = x; r.sz = z; r.svx = vx; r.svz = vz; r.sy = y; r.st = now; r.falling = !!f;
    if (id === myId && !r.falling){
      const ex = x - r.x, ez = z - r.z;
      if (Math.hypot(ex, ez) > 3){ r.x = x; r.z = z; r.vx = vx; r.vz = vz; }
      else { r.x += ex*0.25; r.z += ez*0.25; r.vx += (vx - r.vx)*0.35; r.vz += (vz - r.vz)*0.35; }
    } else if (id === myId){ r.x = x; r.z = z; r.vx = vx; r.vz = vz; r.y = y; }
  }
}
let pingT = 0, stT = 0, inT = 0, sentIn = '';
function netTick(dt){
  if (!net) return;
  const now = performance.now()/1000;
  pingT -= dt;
  if (pingT <= 0){ pingT = 1; netSend({t: 'ping'}); }
  if (net.role === 'host'){
    for (const [c, info] of [...net.conns]) if (now - info.last > NET_TIMEOUT) netDrop(c);
    stT -= dt;
    if (stT <= 0 && (state === 'run' || state === 'countdown' || state === 'over')){ stT = 0.05; sendSnapshot(); }
  } else if (net.joined){
    if (now - net.hostLast > NET_TIMEOUT) return netFail('Lost the connection to the host.');
    inT -= dt;
    const me = riders.get(myId);
    if (me && inT <= 0){
      const m = {t: 'in', x: +me.inp.x.toFixed(2), z: +me.inp.z.toFixed(2), d: me.dseq}, k = m.x + ',' + m.z + ',' + m.d;
      if (k !== sentIn || inT < -0.5){ inT = 0.05; sentIn = k; netSend(m); }
    }
  }
}

/* ---------- input: keyboard, touch stick, controller ---------- */
const keys = new Set();
let leaveArm = 0, gpOn = false, gpFocus = 0;
function localDash(){
  audio();
  const me = riders.get(myId);
  if (!me || !me.inRound || !me.alive || state !== 'run' || me.dashCd > 0 || me.falling) return;
  if (isAuth()) doDashEmit(me, me.inp.x, me.inp.z);
  else { me.dseq++; doDash(me, me.inp.x, me.inp.z); dashFx(me); inT = 0; sentIn = ''; }
}
function tryLeave(){
  if (leaveArm > 0){ leaveArm = 0; toMenu(); return; }
  leaveArm = 2; flash('LEAVE?', mode === 'online' ? 'PRESS AGAIN TO LEAVE THE ROOM' : 'PRESS AGAIN FOR THE MENU');
}
window.addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  audio();
  const inGame = !$('#hud').hidden;
  keys.add(e.code);
  if (inGame && /^(Arrow|Space)/.test(e.code)) e.preventDefault();
  if ((e.code === 'Space' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') && inGame && !e.repeat) localDash();
  else if (e.code === 'KeyM'){ muted = !muted; }
  else if (e.code === 'Escape' && inGame) tryLeave();
});
window.addEventListener('keyup', e => keys.delete(e.code));
window.addEventListener('blur', () => keys.clear());
// touch: drag anywhere on the left 60% for a floating stick; DASH button bottom right
const stick = {id: null, ox: 0, oy: 0, x: 0, y: 0};
$('#c').addEventListener('pointerdown', e => {
  audio();
  if (e.pointerType === 'mouse' || stick.id !== null || e.clientX > innerWidth*0.6) return;
  stick.id = e.pointerId; stick.ox = e.clientX; stick.oy = e.clientY; stick.x = stick.y = 0;
  const s = $('#stick'); s.hidden = false; s.style.left = e.clientX + 'px'; s.style.top = e.clientY + 'px'; s.firstChild.style.transform = '';
  $('#stickhint').hidden = true;
});
window.addEventListener('pointermove', e => {
  if (e.pointerId !== stick.id) return;
  let dx = e.clientX - stick.ox, dy = e.clientY - stick.oy; const m = Math.hypot(dx, dy), L = 50;
  if (m > L){ dx *= L/m; dy *= L/m; }
  stick.x = dx/L; stick.y = dy/L;
  $('#stick').firstChild.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
});
const stickEnd = e => { if (e.pointerId !== stick.id) return; stick.id = null; stick.x = stick.y = 0; $('#stick').hidden = true; };
window.addEventListener('pointerup', stickEnd); window.addEventListener('pointercancel', stickEnd);
$('#tdash').addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); localDash(); });
// controllers
const gpPrev = [];
let gpNavT = 0;
let gpBlocked = false;   // some embeds (like previews) forbid controller access; then skip it quietly
function gpGet(){ if (gpBlocked) return null; let l = []; try{ l = navigator.getGamepads ? navigator.getGamepads() || [] : []; }catch(_){ gpBlocked = true; return null; } let any = null; for (const g of l){ if (!g || !g.connected) continue; if (g.mapping === 'standard') return g; any = any || g; } return any; }
function rumble(s, w, ms){ const g = gpGet(), a = g && g.vibrationActuator; if (a && a.playEffect){ try{ const p = a.playEffect('dual-rumble', {duration: ms, strongMagnitude: s, weakMagnitude: w}); if (p && p.catch) p.catch(() => {}); }catch(_){} } }
function gpMark(){ const btns = [...document.querySelectorAll('#card .btn:not(.off)')]; btns.forEach((b, i) => b.classList.toggle('gp', gpOn && i === gpFocus)); }
let gpStick = {x: 0, z: 0};
function gpUpdate(dt){
  const g = gpGet(); gpStick.x = gpStick.z = 0; if (!g) return;
  if (!gpOn){ gpOn = true; updateHint(); gpMark(); }
  const down = i => !!(g.buttons[i] && g.buttons[i].pressed), pressed = i => down(i) && !gpPrev[i];
  if (g.buttons.some(b => b && b.pressed)) audio();
  const lx = g.axes[0] || 0, ly = g.axes[1] || 0;
  if (!$('#menu').hidden){
    const btns = [...document.querySelectorAll('#card .btn:not(.off)')];
    let dir = 0; if (down(12) || ly < -0.6) dir = -1; else if (down(13) || ly > 0.6) dir = 1;
    gpNavT -= dt;
    if (dir && gpNavT <= 0 && btns.length){ gpNavT = 0.22; gpFocus = (gpFocus + dir + btns.length) % btns.length; gpMark(); }
    if (!dir) gpNavT = 0;
    if (pressed(0) && btns[gpFocus]) btns[gpFocus].click();
    if (pressed(1)){ const back = btns.find(b => ['menu', 'leave', 'cancel'].includes(b.dataset.id)); if (back) back.click(); }
  } else {
    const dl = Math.hypot(lx, ly);
    if (dl > 0.18){ gpStick.x = lx; gpStick.z = ly; }
    if (down(14)) gpStick.x = -1; if (down(15)) gpStick.x = 1; if (down(12)) gpStick.z = -1; if (down(13)) gpStick.z = 1;
    if (pressed(0) || pressed(7) || pressed(5)) localDash();
    if (pressed(9)) tryLeave();
  }
  for (let i = 0; i < g.buttons.length; i++) gpPrev[i] = down(i);
}
function readInput(){
  const me = riders.get(myId); if (!me) return;
  let x = 0, z = 0;
  if (keys.has('KeyA') || keys.has('ArrowLeft')) x -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) x += 1;
  if (keys.has('KeyW') || keys.has('ArrowUp')) z -= 1;
  if (keys.has('KeyS') || keys.has('ArrowDown')) z += 1;
  x += stick.x + gpStick.x; z += stick.y + gpStick.z;
  if (window.NEONSUMO_TEST_INPUT){ x = window.NEONSUMO_TEST_INPUT.x; z = window.NEONSUMO_TEST_INPUT.z; }
  const m = Math.hypot(x, z); if (m > 1){ x /= m; z /= m; }
  if (state !== 'run' || !me.alive){ x = z = 0; }
  me.inp.x = x; me.inp.z = z;
}

/* ---------- main loop ---------- */
let shake = 0, lastBeep = 4, acc = 0, prevT = performance.now()/1000;
const camLook = new THREE.Vector3(), camPos = new THREE.Vector3(), axis = new THREE.Vector3();
function resize(){ const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

function frame(){
  requestAnimationFrame(frame);
  const now = performance.now()/1000; let dt = Math.min(0.1, now - prevT); prevT = now;
  gpUpdate(dt);
  if (leaveArm > 0) leaveArm -= dt;
  if (flashT > 0){ flashT -= dt; if (flashT <= 0 && state !== 'match') $('#msg').innerHTML = ''; }

  if (state === 'countdown'){
    cdLeft -= dt;
    const n = Math.ceil(cdLeft);
    if (n !== lastBeep && n >= 0){ lastBeep = n; if (n > 0){ $('#msg').innerHTML = n + '<small>ROUND ' + round + '</small>'; flashT = 2; sfx.beep(false); } }
    if (cdLeft <= 0){ state = 'run'; flash('GO', 'PUSH THEM OFF'); flashT = 0.9; sfx.beep(true); }
  }

  readInput();
  netTick(dt);

  acc += dt;
  let steps = 0;
  while (acc >= STEP && steps < 6){
    acc -= STEP; steps++;
    if (isAuth() && (state === 'run' || state === 'countdown' || state === 'over' || state === 'match')) authStep(STEP);
    else if (mode === 'online' && (state === 'run' || state === 'countdown' || state === 'over')){
      // joiner: predict our own ball, bounce it off where the others appear to be
      const me = riders.get(myId);
      if (me && me.inRound && me.alive && !me.falling){
        stepBall(me, STEP, state === 'run');
        for (const o of riders.values()) if (o !== me && o.inRound && o.alive){ const ghostB = {x: o.dx, z: o.dz, vx: o.svx, vz: o.svz, y: o.dy}; collide(me, ghostB, true); }
      }
    }
  }
  if (steps === 6) acc = 0;
  if (isAuth()) authTick(dt);
  else if (state === 'run') tRun += dt;

  // place every ball on screen
  const joiner = !isAuth();
  for (const r of riders.values()){
    const g = r.mesh.g;
    if (!r.inRound || !r.alive){ g.visible = false; continue; }
    g.visible = true;
    const px = r.dx, pz = r.dz;
    if (joiner && (r.id !== myId || r.falling)){
      const age = Math.min(0.25, now - r.st);
      const tx = r.sx + r.svx*age, tz = r.sz + r.svz*age, k = 1 - Math.exp(-18*dt);
      r.dx += (tx - r.dx)*k; r.dz += (tz - r.dz)*k; r.dy += (r.sy - r.dy)*k;
    } else { r.dx = r.x; r.dz = r.z; r.dy = r.y; }
    g.position.set(r.dx, r.dy, r.dz);
    const mx = r.dx - px, mz = r.dz - pz, dist = Math.hypot(mx, mz);
    if (dist > 1e-4 && dist < 3){ axis.set(mz, 0, -mx).normalize(); r.mesh.ball.rotateOnWorldAxis(axis, dist/BALL); }
    r.pulse = Math.max(0, r.pulse - dt*2.5);
    const s = 4.2 + r.pulse*3; r.mesh.halo.scale.set(s, s, 1);
    r.mesh.ball.material.emissiveIntensity = 1.1 + r.pulse*1.6;
    r.mesh.pad.visible = !r.falling && r.dy > -0.5;
    if (r.falling && !r.wasFalling){ r.wasFalling = true; sfx.fall(); burst(r.dx, 0.2, r.dz, colorOf(r.id), 18, 4); }
  }

  // platform, rim warning
  setPlatform(R);
  const shrinking = state === 'run' && R < R0 - 0.01 && Math.abs(R - RMIN) > 0.01;
  const warn = shrinking ? 0.5 + 0.5*Math.sin(now*8) : 0;
  rimMat.color.setHex(shrinking ? 0xff4fbf : 0x33d9ff).multiplyScalar(0.7 + warn*0.6);
  curtainMat.uniforms.col.value.setHex(shrinking ? 0xff4fbf : 0x33d9ff);
  sparksUpdate(dt);

  // camera: high and behind, leaning toward your ball, wider on portrait screens
  const me = riders.get(myId);
  const portrait = Math.max(1, 1.25/camera.aspect);
  const fit = 0.65 + 0.35*(R/R0);
  const follow = me && me.inRound && me.alive && !me.falling ? 0.22 : 0;
  camLook.lerp(new THREE.Vector3(me ? me.dx*follow : 0, 0, me ? me.dz*follow : 0), 1 - Math.exp(-3*dt));
  camPos.set(camLook.x, 25*portrait*fit + 4, camLook.z + 21*portrait*fit + 3);
  camera.position.copy(camPos);
  if (shake > 0){ shake = Math.max(0, shake - dt*1.6); camera.position.x += (Math.random() - 0.5)*shake; camera.position.y += (Math.random() - 0.5)*shake; }
  camera.lookAt(camLook.x, -1, camLook.z + 1);
  if (state === 'idle' || state === 'lobby'){
    const a = now*0.08; camera.position.set(Math.sin(a)*30, 22, Math.cos(a)*30); camera.lookAt(0, -2, 0);
  }

  // your marker and dash bar
  if (me && me.inRound && me.alive){
    youMark.visible = true; youMark.position.set(me.dx, me.dy + BALL*2 + 0.9 + Math.sin(now*4)*0.12, me.dz);
    const f = 1 - me.dashCd/DASH_CD;
    $('#dashbar i').style.transform = 'scaleX(' + f.toFixed(3) + ')';
    $('#dashbar').classList.toggle('ready', f >= 1);
    $('#tdash').classList.toggle('ready', f >= 1);
  } else youMark.visible = false;
  $('#dashbar').hidden = !(me && me.inRound && me.alive);

  renderer.render(scene, camera);
}

// expose a little state for automated tests
window.__sumo = {get state(){ return state; }, get mode(){ return mode; }, get roster(){ return roster; }, get scores(){ return scores; }, get round(){ return round; }, get R(){ return R; }, get myId(){ return myId; },
  riders: () => [...riders.values()].map(r => ({id: r.id, x: r.x, z: r.z, dx: r.dx, dz: r.dz, alive: r.alive, inRound: r.inRound, falling: r.falling})), page: () => page, net: () => net && {role: net.role, code: net.code}};

addEventListener('pagehide', netLeave);   // tell the room right away when the tab closes
showPage('main');
const m = /room=([A-Za-z0-9]{4})/.exec(location.hash);
if (m){ lastCode = m[1].toUpperCase(); netJoin(lastCode); }
requestAnimationFrame(frame);
})();
</script>
